<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horario 1º SMR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Horario 1º SMR</h1>

    <table border="">
        <thead>
            <tr>
                <th>Lunes</th>
                <th>Martes</th>
                <th>Miércoles</th>
                <th>Jueves</th>
                <th>Viernes</th>
            </tr>
        </thead>
        <tbody>
           
            <tr>
                <td rowspan="3">MMEQ</td>
                <td>FOL</td>
                <td>SOM</td>
                <td>AWEB</td>
                <td>REDL</td>
            </tr>
            <!-- Fila 2 -->
            <tr>
                <td>AWEB</td>
                <td>SOM</td>
                <td>AWEB</td>
                <td>REDL</td>
            </tr>
            <!-- Fila 3 -->
            <tr>
                <td>AWEB</td>
                <td>FOL</td>
                <td>REDL</td>
                <td>MMEQ</td>
            </tr>

            <!-- Fila de Recreo (ocupa las 5 columnas) -->
            <tr>
                <td colspan="5" class="recreo">Recreo</td>
            </tr>

            <!-- Fila 4 -->
            <tr>
                <td rowspan="2">ING</td>
                <td rowspan="2">MMEQ</td>
                <td>FOL</td>
                <td>REDL</td>
                <td>MMEQ</td>
            </tr>
            <!-- Fila 5 -->
            <tr>
                <td rowspan="2">AWEB</td>
                <td>SOM</td>
                <td>SOM</td>
            </tr>
            <!-- Fila 6 -->
            <tr>
                <td>REDL</td>
                <td>ING</td>
                <td>SOM</td>
                <td>SOM</td>
            </tr>
        </tbody>
    </table>

</body>
